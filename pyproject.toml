[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "measurement-gated-provenance-attenuation"
version = "0.1.0"
description = "Measurement-informed correction of frozen representations"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==1.26.4", "scipy==1.16.3", "scikit-learn==1.7.1",
  "torch==2.7.1", "matplotlib==3.10.5", "pandas==2.3.2",
]

[project.optional-dependencies]
raw = ["mne==1.11.0", "einops==0.8.2", "braindecode==1.8.1",
       "safetensors==0.8.0", "curryreader==0.1.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mgpa", "mgpa.*"]
namespaces = false
